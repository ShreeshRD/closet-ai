<button
  type="button"
  class="tile log-tile{% if item.is_recent %} tile-recent{% endif %}"
  data-item-id="{{ item.id }}"
  data-name="{{ item.display_name }}"
  data-color="{{ item.color }}"
  data-type="{{ item.type }}"
  data-wears="{{ item.wears_since_wash }}"
  data-qty="{{ item.quantity }}"
  data-group="{{ group | default('ready') }}"
  {% if item.is_recent %}data-recent="1"{% endif %}
  {% if item.primary_photo_path %}data-photo="{{ item.primary_photo_path }}"{% endif %}
  aria-pressed="false"
  aria-label="{{ item.display_name }}{% if item.is_recent %} — recently worn{% endif %} — select to rate"
  {% if item.is_recent %}title="Recently worn (within 12h) — still rateable"{% endif %}
>
  <span class="tile-photo swatch-fill" data-color="{{ item.color }}">
    <span class="tile-initial">{{ item.type[0]|upper if item.type else '?' }}</span>
    {% if item.primary_photo_path %}
    <img src="{{ item.primary_photo_path }}" alt="" />
    {% endif %}
    <span class="tile-check" hidden>✓</span>
  </span>
  <span class="tile-caption">
    <span class="tile-name">{{ item.display_name }}</span>
    {% if item.quantity > 1 %}<span class="tile-qty">×{{ item.quantity }}</span>{% endif %}
    {% if item.is_recent %}
      <span class="tile-recent-tag" title="Recently worn">recent</span>
    {% else %}
      <span class="tile-wears">{{ item.wears_since_wash }}w</span>
    {% endif %}
  </span>
</button>
