[project]
name = "closet-ai"
version = "0.1.0"
description = "Local wardrobe AI: catalog clothes, track wears, know what to wash"
authors = [
    { name = "ShreeshRD", email = "shreeshrdevi2@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.20",
    "itsdangerous>=2.2.0",
]

[project.scripts]
closet-ai = "closet_ai.main:run"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = true
